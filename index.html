<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3eadf">
  <meta name="description" content="LunaGuna — מעקב גונות לסייקל הנשי. החישוב נשמר רק במכשיר. לא ייעוץ רפואי ולא אמצעי מניעה.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>LunaGuna — מעקב גונות לסייקל הנשי</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/heebo-hebrew-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/frank-hebrew-700.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <a class="skip" id="skip" href="#main">דלגי לתוכן</a>
  <header class="site-header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#c46a52"/>
        <circle cx="21" cy="20" r="11" fill="#fff6ec"/>
        <circle cx="27" cy="18" r="9" fill="#c46a52"/>
        <circle cx="14" cy="36" r="1.8" fill="#d5e4cf"/>
        <circle cx="23" cy="38" r="1.8" fill="#fff6ec"/>
        <circle cx="32" cy="36" r="1.8" fill="#e6c98a"/>
      </svg>
      <div>
        <p class="brand-name" dir="ltr" lang="en">LunaGuna</p>
        <p class="brand-tag" id="tagline">מעקב גונות לסייקל הנשי</p>
      </div>
    </div>
    <button type="button" class="lang-toggle" id="lang-toggle" lang="en" aria-label="החלפה לאנגלית">English</button>
  </header>
  <nav class="nav" id="nav" aria-label="ניווט">
    <button type="button" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      <span>היום</span>
    </button>
    <button type="button" data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      <span>לוח</span>
    </button>
    <button type="button" data-view="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a7 7 0 1 0 7 7"/><circle cx="12" cy="11" r="2.2" fill="currentColor" stroke="none"/></svg>
      <span>גונות</span>
    </button>
    <button type="button" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="10" cy="17" r="1.6" fill="currentColor"/></svg>
      <span>הגדרות</span>
    </button>
  </nav>
  <div class="shell">
    <div class="layout">
      <main id="main"></main>
      <aside id="aside"></aside>
    </div>
  </div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript>
    <p class="card noscript">LunaGuna מחשבת את הגונה במכשיר שלך וצריכה JavaScript. אין שרת, ואין שליחה של נתונים.</p>
  </noscript>
  <dialog id="calendar-dialog" aria-labelledby="calendar-dialog-title">
    <form method="dialog">
      <h2 id="calendar-dialog-title">בחרי יומן</h2>
      <p id="calendar-dialog-note"></p>
      <div class="dialog-actions">
        <button type="submit" class="button" id="calendar-google" value="google">הוסיפי ליומן Google</button>
        <button type="submit" class="button secondary" id="calendar-ics" value="ics">הורדת קובץ ליומן</button>
        <button type="submit" class="button secondary" id="calendar-cancel" value="cancel">סגירה</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">למחוק את כל הנתונים?</h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button type="submit" class="button secondary" id="confirm-no" value="cancel">ביטול</button>
        <button type="submit" class="button danger" id="confirm-yes" value="yes">כן, מחקי</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
